
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b24">
<title>رصد مناقصات منطقه ویژه پارس</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f2f6f3;
 color:#18332a;
 font-family:Tahoma,Arial,sans-serif;
}
header{
 background:linear-gradient(135deg,#102b24,#23634b);
 color:white;
 padding:28px 18px 30px;
 border-radius:0 0 25px 25px;
}
.container{max-width:760px;margin:auto;padding:16px}
h1{font-size:21px;margin:0 0 12px}
.subtitle{font-size:13px;color:#d5e9dd;line-height:2}
.stats{display:flex;gap:10px;margin-top:20px}
.stat{
 flex:1;
 background:#ffffff18;
 border:1px solid #ffffff30;
 border-radius:13px;
 padding:12px;
 text-align:center;
}
.stat strong{display:block;font-size:22px}
.stat span{font-size:11px;color:#d5e9dd}
.toolbar{display:flex;gap:8px;margin:16px 0}
input{
 flex:1;
 min-width:0;
 border:1px solid #d7e2db;
 border-radius:12px;
 padding:13px;
 font-size:14px;
 background:white;
 outline:none;
}
button{
 border:0;
 border-radius:12px;
 padding:12px 16px;
 background:#1c6248;
 color:white;
 font-size:13px;
 cursor:pointer;
}
button:disabled{opacity:.5;cursor:wait}
.card{
 background:white;
 border:1px solid #e2eae5;
 border-radius:16px;
 padding:16px;
 margin:12px 0;
 box-shadow:0 3px 12px #153e2510;
}
.card h3{font-size:15px;line-height:2;margin:0 0 12px}
.meta{display:flex;flex-wrap:wrap;gap:7px}
.tag{
 background:#eef5f0;
 color:#285b43;
 padding:7px 9px;
 border-radius:8px;
 font-size:11px;
}
.number{color:#718078;font-size:11px;margin-bottom:8px}
.deadline{
 font-size:12px;
 color:#52665b;
 margin-top:13px;
}
.card a{
 display:inline-block;
 margin-top:13px;
 color:#176344;
 font-size:12px;
}
#status{
 background:white;
 border-radius:12px;
 padding:14px;
 font-size:13px;
 line-height:2;
 margin-top:15px;
 overflow-wrap:anywhere;
}
#status.error{
 color:#9c3030;
 border:1px solid #e9caca;
 background:#fff8f8;
}
#status.success{
 color:#24613e;
 border:1px solid #d2e6d7;
}
#status a{color:#176344}
.hidden{display:none}
footer{
 text-align:center;
 color:#84918a;
 font-size:11px;
 padding:25px;
}
</style>
</head>

<body>

<header>
 <div class="container">
  <h1>رصد مناقصات منطقه ویژه پارس</h1>
  <div class="subtitle">
   پایش آگهی‌های شرکت منطقه ویژه اقتصادی انرژی پارس<br>
   استان بوشهر
  </div>

  <div class="stats">
   <div class="stat">
    <strong id="count">۰</strong>
    <span>تعداد آگهی‌ها</span>
   </div>

   <div class="stat">
    <strong id="updated">—</strong>
    <span>آخرین بررسی</span>
   </div>
  </div>
 </div>
</header>

<main class="container">

 <div class="toolbar">
  <input
   id="search"
   placeholder="جستجو در عنوان یا شماره آگهی..."
  >
  <button id="refresh" onclick="loadAds()">
   به‌روزرسانی
  </button>
 </div>

 <div id="status">
  آماده دریافت آگهی‌ها...
 </div>

 <section id="ads"></section>

</main>

<footer>
 منبع اطلاعات: سامانه تدارکات الکترونیکی دولت (ستاد)
<br>
شرکت منطقه ویژه اقتصادی انرژی پارس | استان بوشهر
</footer>

<script>

"use strict";

const API =
 "https://gw.setadiran.ir/api/centralboard/cards/";

const ORG_ID = "14580";
const ORG_NAME = "شرکت منطقه ویژه اقتصادی انرژی پارس";
const PROVINCE = "بوشهر";

const BOARD =
 "https://fe.setadiran.ir/centralboard/#/central-board-0";

const PAGE_SIZE = 5;
const REQUEST_TIMEOUT = 20000;
const MAX_PAGES = 20;

let advertisements = [];
let isLoading = false;

const $ = id => document.getElementById(id);

function normalize(value) {
 return String(value ?? "")
  .replace(/ي/g, "ی")
  .replace(/ك/g, "ک")
  .replace(/\u200c/g, " ")
  .replace(/\s+/g, " ")
  .trim();
}

function escapeHTML(value) {
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[c]);
}

function apiURL(page) {
 const url = new URL(API);

 url.searchParams.set("searchTypeCode", "0");
 url.searchParams.set("selectedOrganization", ORG_ID);
 url.searchParams.set("isLogin", "false");
 url.searchParams.set("userRole", "0");
 url.searchParams.set("queryText", "");
 url.searchParams.set("pageNumber", String(page));
 url.searchParams.set("pageSize", String(PAGE_SIZE));
 url.searchParams.set("sort", "score,desc");

 return url.toString();
}

function setStatus(message, type = "") {
 const status = $("status");
 status.className = type;
 status.textContent = message;
}

function showError(message) {
 const status = $("status");

 status.className = "error";
 status.replaceChildren();

 status.appendChild(
  document.createTextNode(message)
 );

 status.appendChild(document.createElement("br"));

 const link = document.createElement("a");

 link.href = apiURL(0);
 link.target = "_blank";
 link.rel = "noopener noreferrer";
 link.textContent = "مشاهده مستقیم اطلاعات از API ستاد";

 status.appendChild(link);
}

async function fetchPage(page) {

 const controller = new AbortController();

 const timeout = setTimeout(
  () => controller.abort(),
  REQUEST_TIMEOUT
 );

 try {

  const response = await fetch(apiURL(page), {
   method: "GET",
   headers: {
    "Accept": "application/json"
   },
   cache: "no-store",
   signal: controller.signal
  });

  if (!response.ok) {
   throw new Error(
    "خطای HTTP " + response.status
   );
  }

  const data = await response.json();

  let items = null;

  if (Array.isArray(data)) {
   items = data;
  } else if (Array.isArray(data?.content)) {
   items = data.content;
  } else if (Array.isArray(data?.data?.content)) {
   items = data.data.content;
  }

  if (!items) {
   throw new Error(
    "ساختار پاسخ API تغییر کرده است."
   );
  }

  return {
   items,
   totalPages: Number(
    data?.totalPages ??
    data?.data?.totalPages ??
    1
   )
  };

 } catch (error) {

  if (error.name === "AbortError") {
   throw new Error(
    "زمان انتظار برای پاسخ ستاد تمام شد (۲۰ ثانیه)."
   );
  }

  if (
   error instanceof TypeError ||
   error.name === "TypeError"
  ) {
   throw new Error(
    "مرورگر نتوانست به API ستاد متصل شود. ممکن است محدودیت CORS یا قطعی سرور وجود داشته باشد."
   );
  }

  throw error;

 } finally {
  clearTimeout(timeout);
 }
}

async function getAds() {

 let all = [];
 let pages = 1;

 for (
  let page = 0;
  page < pages && page < MAX_PAGES;
  page++
 ) {

  setStatus(
   "در حال دریافت صفحه " +
   (page + 1) +
   " از " +
   pages +
   " آگهی‌ها..."
  );

  const result = await fetchPage(page);

  all.push(...result.items);

  pages = Math.max(
   1,
   result.totalPages
  );

  if (!result.items.length) {
   break;
  }
 }

 const unique = new Map();

 for (const ad of all) {

  const correctOrganization =
   String(ad.orgId) === ORG_ID &&
   normalize(ad.orgName) === normalize(ORG_NAME);

  const correctProvince =
   normalize(ad.provinceName) === normalize(PROVINCE);

  if (
   correctOrganization &&
   correctProvince &&
   ad.number != null
  ) {
   unique.set(
    String(ad.number),
    ad
   );
  }
 }

 return [...unique.values()];
}

async function loadAds() {

 if (isLoading) return;

 isLoading = true;
 $("refresh").disabled = true;

 $("ads").innerHTML = "";

 setStatus(
  "در حال اتصال به سامانه ستاد..."
 );

 try {

  advertisements = await getAds();

  $("count").textContent =
   advertisements.length.toLocaleString("fa-IR");

  $("updated").textContent =
   new Date().toLocaleTimeString("fa-IR", {
    hour: "2-digit",
    minute: "2-digit"
   });

  setStatus(
   advertisements.length
    ? "اطلاعات با موفقیت دریافت شد."
    : "اتصال برقرار شد، اما آگهی منطبقی پیدا نشد.",
   "success"
  );

  renderAds();

 } catch (error) {

  console.error("SETAD ERROR:", error);

  showError(
   "دریافت آگهی‌ها ناموفق بود:\n" +
   error.message
  );

 } finally {

  isLoading = false;
  $("refresh").disabled = false;

 }
}

function renderAds() {

 const query = normalize(
  $("search").value
 );

 const container = $("ads");

 const filtered = advertisements.filter(ad => {

  const title = normalize(ad.title);
  const number = String(ad.number ?? "");

  return (
   title.includes(query) ||
   number.includes(query)
  );

 });

 if (!filtered.length) {

  container.innerHTML =
   '<div id="status">آگهی موردنظر پیدا نشد.</div>';

  return;
 }

 container.innerHTML = filtered.map(ad => {

  const number = escapeHTML(ad.number);
  const title = escapeHTML(
   ad.title || "بدون عنوان"
  );

  const city = escapeHTML(
   ad.cityName || "نامشخص"
  );

  const board = escapeHTML(
   ad.boardName || "آگهی"
  );

  const deadline = escapeHTML(
   ad.jalaliSendDeadlineDate || "اعلام نشده"
  );

  return `
   <article class="card">

    <div class="number">
     شماره آگهی: ${number}
    </div>

    <h3>${title}</h3>

    <div class="meta">
     <span class="tag">${board}</span>
     <span class="tag">شهر: ${city}</span>
     <span class="tag">استان: بوشهر</span>
    </div>

    <div class="deadline">
     مهلت ارسال: ${deadline}
    </div>

    <a
     href="${BOARD}"
     target="_blank"
     rel="noopener noreferrer"
    >
     ورود به سامانه ستاد
    </a>

   </article>
  `;

 }).join("");

}

$("search").addEventListener(
 "input",
 renderAds
);

loadAds();

</script>

</body>
</html>
